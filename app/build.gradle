plugins { id 'com.android.application' }

def releaseSigning = new Properties()
def releaseSigningFile = rootProject.file('release-signing.properties')
if (releaseSigningFile.exists()) releaseSigningFile.withInputStream { releaseSigning.load(it) }

android {
    namespace 'com.litongjava.localmusic'
    compileSdk 35
    defaultConfig {
        applicationId 'com.litongjava.localmusic'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '2.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    // Preserve the original 2023 player/Whisper prototype in src/main for reference.
    // The offline player has its own entry point and service; no legacy singleton is packaged.
    sourceSets {
        main {
            java.srcDirs = ['src/offline/java']
            res.srcDirs = ['src/offline/res']
            assets.srcDirs = ['src/offline/assets']
            jniLibs.srcDirs = []
            manifest.srcFile 'src/offline/AndroidManifest.xml'
        }
        test.java.srcDirs = ['src/offlineTest/java']
        androidTest.java.srcDirs = ['src/offlineAndroidTest/java']
        androidTest.manifest.srcFile 'src/offlineAndroidTest/AndroidManifest.xml'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://maven.aliyun.com/repository/public'
        }
    }
    signingConfigs {
        if (releaseSigningFile.exists()) {
            localRelease {
                storeFile rootProject.file(releaseSigning['storeFile'])
                storePassword releaseSigning['storePassword']
                keyAlias releaseSigning['keyAlias']
                keyPassword releaseSigning['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningFile.exists()) signingConfig signingConfigs.localRelease
        }
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-session:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
